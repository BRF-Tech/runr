# ci/check-helm-chart.sh: observability with every knob set (docs/observability.md, docs/load-test.md)
domain: console.acme-cloud.example
observability:
  tracing:
    defaultMode: external
    installWithServing: false
    knativeSampleRate: 0.5
    tempoRetentionHours: 168
    tempoStorage: 50Gi
    collectorChartVersion: "0.110.0"
    tempoChartVersion: "1.10.0"
    collectorImage: registry.acme-cloud.example/mirror/opentelemetry-collector-contrib:0.162.0
    tempoImage: registry.acme-cloud.example/mirror/tempo:3.1.0
  replay:
    maxBodyBytes: 131072
    retentionDays: 14
    maxCaptures: 1000
    ingestUrl: https://console.acme-cloud.example
  uptime:
    minIntervalSeconds: 60
    resultsRetentionDays: 30
    allowPrivateTargets: true
  loadTest:
    enabled: true
    dailyLimit: 5
    maxUsers: 50
    maxDurationSeconds: 60
    maxConcurrentPerRegion: 2
    image: registry.acme-cloud.example/mirror/k6:1.8.2
  statusPage:
    enabled: false
  alerts:
    deliveryTries: 6
    allowPrivateTargets: true
