# ci/check-helm-chart.sh: the operator manages runr-secret (secret.create=false) and keeps the
# database, SMTP and Redis passwords in Secrets of their own; the bootstrap Job stores a generated
# administrator password in runr-admin when runr-secret has no ADMIN_PASSWORD
domain: console.acme-cloud.example
secret:
  create: false
database:
  host: postgres.acme-cloud.example
  existingSecret: acme-postgres
mail:
  host: smtp.acme-cloud.example
  port: "587"
  username: runr@acme-cloud.example
  existingSecret: acme-smtp
  encryption: starttls
redis:
  existingSecret: runr-secret
  existingSecretPasswordKey: REDIS_PASSWORD
