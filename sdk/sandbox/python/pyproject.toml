[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "runr-sandbox"
version = "0.1.0"
description = "Python client for the RunR Sandbox API: isolated code execution for AI agents and apps on your own Kubernetes cluster."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "RunR contributors" }]
keywords = ["runr", "sandbox", "code-interpreter", "ai-agents", "kubernetes", "gvisor", "kata-containers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25", "websockets>=13"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://runr.sh"
Repository = "https://github.com/brf-tech/runr"
Documentation = "https://runr.sh/docs/sandbox-api"

[tool.hatch.build.targets.wheel]
packages = ["src/runr_sandbox"]

[tool.hatch.build.targets.sdist]
include = ["src/runr_sandbox", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
