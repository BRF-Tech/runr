#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json
# Default Spin manifest of a wasm-python function (build.files). One component serves every path;
# RunR's triggers (http, queue, schedule) all arrive as HTTP requests on it. The packages of a
# project's requirements.txt are installed into /tmp/runr-deps before `spin build`.
spin_manifest_version = 2

[application]
name = "runr-function"
version = "0.1.0"
description = "A RunR function (Python, componentize-py + Spin Python SDK)"

[[trigger.http]]
route = "/..."
component = "function"

[component.function]
source = "app.wasm"
# outbound HTTP(S) to any host; narrow it in a project's own spin.toml
allowed_outbound_hosts = ["https://*:*", "http://*:*"]

[component.function.build]
command = "componentize-py -w spin:up/http-trigger@4.1.0 componentize -p . -p /tmp/runr-deps app -o app.wasm"
