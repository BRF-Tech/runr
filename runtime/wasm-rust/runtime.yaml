# Built-in runtime: Rust → WebAssembly (Spin Rust SDK). Every version is compiled with cargo into a
# Spin component (wasm32-wasip1) and pushed to the region registry as a Spin OCI artifact; the
# pods run under containerd-shim-spin (RuntimeClass wasmtime-spin-v2) on the nodes with
# WebAssembly support — docs/wasm.md. Every trigger is an HTTP request: queue messages and
# schedule ticks arrive as CloudEvents (ce-type header).
apiVersion: runr.sh/v1
kind: Runtime
id: wasm-rust
name: Rust (Wasm)
description: "Rust compiled to a WebAssembly component with the Spin SDK — #[http_component] fn handle(req: Request). Millisecond-class cold starts in the WebAssembly sandbox; needs WebAssembly support in the region."
icon: data:image/svg+xml;base64,
language: rust
extensions: [rs]
category: general
versions:
  - version: "4.1"
    image: ghcr.io/brf-tech/exec-wasm-rust:4.1
    default: true
handler:
  file: lib
  function: handle
  pattern: '#\[http_component\]'
template:
  files:
    "{file}": |
      use spin_sdk::http::{IntoResponse, Request, Response};
      use spin_sdk::http_component;

      /// Every trigger reaches the component as an HTTP request: queue messages and schedule
      /// ticks arrive as CloudEvents (the ce-type header names the event).
      #[http_component]
      fn handle(req: Request) -> anyhow::Result<impl IntoResponse> {
          let event = req.header("ce-type").and_then(|v| v.as_str()).unwrap_or("");
          let body = match event {
              "dev.runr.schedule.tick" => "tick from Rust (Wasm)".to_string(),
              "dev.runr.queue.message" => format!("processed {} (from Rust, Wasm)", String::from_utf8_lossy(req.body())),
              _ => {
                  let name = req.query().split('&').find_map(|p| p.strip_prefix("name=")).unwrap_or("World");
                  format!("Hello, {name}! (from Rust, Wasm)")
              }
          };
          println!("{body}");
          Ok(Response::builder()
              .status(200)
              .header("content-type", "text/plain")
              .body(body)
              .build())
      }
build:
  # the image's Cargo.lock and compiled dependencies (CARGO_TARGET_DIR) serve the default Cargo.toml;
  # a project's own Cargo.toml resolves what it adds
  command: >-
    { [ -f Cargo.lock ] || cp /opt/runr/rust/Cargo.lock . ; } &&
    ln -sfn "$CARGO_TARGET_DIR" target &&
    spin build
  source: false
  files:
    Cargo.toml: "@Cargo.toml"
    spin.toml: "@spin.toml"
run:
  mode: http
  schedule: native
  env:
    SPIN_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
triggers: [http, schedule, queue]
resources:
  cpu: "100m"
  memory_mb: 128
runtimeClass: wasmtime-spin-v2
