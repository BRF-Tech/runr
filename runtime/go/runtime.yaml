# Built-in runtime: Go. Compiled: every version is built into a static binary together with the
# RunR wrapper source of its trigger (wrapper_http.go / wrapper_schedule.go call Handler).
apiVersion: runr.sh/v1
kind: Runtime
id: go
name: Go
description: Go, compiled to a static binary — func Handler(event, context interface{}) (interface{}, error).
language: go
extensions: [go]
category: general
versionDiscovery:
  repository: ghcr.io/brf-tech/runr/exec-go
  image: "ghcr.io/brf-tech/runr/exec-go:{version}"
  eol: go
handler:
  file: main
  function: handler
  pattern: 'func\s+Handler\s*\('
template:
  files:
    "{file}": |-
      package main

      // {Handler} is the entry point for this function.
      func {Handler}(event interface{}, context interface{}) (interface{}, error) {
      	return map[string]interface{}{
      		"statusCode": 200,
      		"body":       "Hello, World!",
      	}, nil
      }
build:
  image: "{image}"
  command: >-
    mkdir -p /build/src && cp /build/code/*.go /build/src/ && cd /build/src &&
    go mod init runr-function && go mod tidy &&
    CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o /build/out/handler .
  runImage: ghcr.io/brf-tech/runr/reqs/alpine:3.20
  source: false
  files:
    runr_wrapper_.go:
      http: "@wrapper_http.go"
      schedule: "@wrapper_schedule.go"
run:
  mode: http
  schedule: native
  command: ["/app/handler"]
triggers: [http, schedule, queue]
sandbox: [runc, gvisor, kata]
