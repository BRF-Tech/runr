# Built-in runtime: Python. The image (Dockerfile in this directory) serves the RunR HTTP contract
# itself (server.py) and runs a scheduled invocation once (runner.py, RUNR_MODE=schedule).
apiVersion: runr.sh/v1
kind: Runtime
id: python
name: Python
description: CPython with the RunR handler server — def handler(event, context).
language: python
extensions: [py]
category: general
versionDiscovery:
  repository: runrsh/exec-python
  image: "ghcr.io/brf-tech/exec-python:{version}"
  eol: python
handler:
  file: main
  function: handler
  pattern: 'def\s+handler\s*\('
template:
  files:
    "{file}": |-
      def {handler}(event, context):
          return {"statusCode": 200, "body": "Hello, World!"}
dependencies:
  file: requirements.txt
  template: "redis>=5.0\n"
  install: pip install --no-cache-dir --target=/build/vendor -r /build/code/requirements.txt
  copy:
    - { from: /build/vendor, to: /app/vendor }
  env:
    PYTHONPATH: /app/vendor
run:
  mode: http
  schedule: native
triggers: [http, schedule, queue]
sandbox: [runc, gvisor, kata]
