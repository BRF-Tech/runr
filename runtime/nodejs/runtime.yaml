# Built-in runtime: Node.js (LTS lines). server.js serves the RunR HTTP contract, runner.js runs a
# scheduled invocation once.
apiVersion: runr.sh/v1
kind: Runtime
id: nodejs
name: Node.js
description: Node.js LTS with the RunR handler server — exports.handler = async (event, context).
language: javascript
extensions: [js]
category: general
versionDiscovery:
  repository: runrsh/exec-nodejs
  image: "ghcr.io/runrsh/exec-nodejs:{version}"
  eol: nodejs
  filter: lts-even-major
handler:
  file: main
  function: handler
  pattern: '(?:exports\.handler|module\.exports\.handler|function\s+handler|const\s+handler)'
template:
  files:
    "{file}": |-
      exports.{handler} = async (event, context) => {
          return { statusCode: 200, body: 'Hello, World!' };
      };
dependencies:
  file: package.json
  template: '{"dependencies":{"ioredis":"^5"}}'
  install: cd /build/code && npm install --production
  copy:
    - { from: /build/code/node_modules, to: /app/code/node_modules }
run:
  mode: http
  schedule: native
triggers: [http, schedule, queue]
sandbox: [runc, gvisor, kata]
