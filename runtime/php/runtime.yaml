# Built-in runtime: PHP. server.php serves the RunR HTTP contract, runner.php runs a scheduled
# invocation once. Composer runs in the composer image, with the platform pinned to the runtime's
# PHP version when the version is a plain number.
apiVersion: runr.sh/v1
kind: Runtime
id: php
name: PHP
description: PHP CLI with the RunR handler server — function handler($event, $context).
language: php
extensions: [php]
category: general
versionDiscovery:
  repository: runrsh/exec-php
  image: "ghcr.io/runrsh/exec-php:{version}"
  eol: php
handler:
  file: main
  function: handler
  pattern: 'function\s+handler\s*\('
template:
  files:
    "{file}": |-
      <?php

      function {handler}($event, $context): array
      {
          return ['statusCode' => 200, 'body' => 'Hello, World!'];
      }
dependencies:
  file: composer.json
  template: '{"require":{"predis/predis":"^2.0"}}'
  image: ghcr.io/runrsh/reqs/composer:latest
  install: cd /build/code && {if:semver}composer config platform.php {semver} && {end}composer install --no-dev --no-interaction
  copy:
    - { from: /build/code/vendor, to: /app/code/vendor }
run:
  mode: http
  schedule: native
triggers: [http, schedule, queue]
sandbox: [runc, gvisor, kata]
