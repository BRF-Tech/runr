# Built-in runtime: TensorFlow (Python with TensorFlow and the ML essentials preinstalled). Same
# handler server as the Python runtime.
apiVersion: runr.sh/v1
kind: Runtime
id: tensorflow
name: TensorFlow
description: Python with TensorFlow preinstalled — def handler(event, context).
language: python
extensions: [py]
category: ml
versionDiscovery:
  repository: runrsh/exec-tensorflow
  image: "ghcr.io/runrsh/exec-tensorflow:{version}"
  eol: tensorflow
handler:
  file: main
  function: handler
template:
  files:
    "{file}": |-
      import tensorflow as tf

      def {handler}(event, context):
          """TensorFlow inference handler"""
          tensor = tf.constant([[1.0, 2.0], [3.0, 4.0]])
          result = tf.reduce_mean(tensor).numpy()
          return {"statusCode": 200, "body": f"TensorFlow {tf.__version__} — mean: {result}"}
dependencies:
  file: requirements.txt
  template: ""
  install: pip install --no-cache-dir --target=/build/vendor -r /build/code/requirements.txt
  copy:
    - { from: /build/vendor, to: /app/vendor }
  env:
    PYTHONPATH: /app/vendor
run:
  mode: http
  schedule: native
triggers: [http, schedule, queue]
sandbox: [runc, gvisor, kata]
