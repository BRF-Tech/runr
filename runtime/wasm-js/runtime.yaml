# Built-in runtime: JavaScript / TypeScript → WebAssembly (Spin JS SDK). Every version is bundled
# with esbuild and componentized (StarlingMonkey) into a Spin component and pushed to the region
# registry as a Spin OCI artifact; the pods run under containerd-shim-spin (RuntimeClass
# wasmtime-spin-v2) on the nodes with WebAssembly support — docs/wasm.md. Every trigger is an
# HTTP request: queue messages and schedule ticks arrive as CloudEvents (ce-type header).
apiVersion: runr.sh/v1
kind: Runtime
id: wasm-js
name: JavaScript (Wasm)
description: "JavaScript or TypeScript as a WebAssembly component with the Spin JS SDK — addEventListener('fetch', ...) with the web Request / Response API. Millisecond-class cold starts in the WebAssembly sandbox; needs WebAssembly support in the region."
icon: data:image/svg+xml;base64,
language: javascript
extensions: [js, ts, mjs]
category: general
versions:
  - version: "4.1"
    image: ghcr.io/runrsh/exec-wasm-js:4.1
    default: true
handler:
  file: index
  function: handler
  pattern: 'addEventListener\s*\(\s*[''"]fetch[''"]'
template:
  files:
    "{file}": |
      // Every trigger reaches the component as an HTTP request: queue messages and schedule ticks
      // arrive as CloudEvents (the ce-type header names the event).
      async function handle(request) {
        const event = request.headers.get('ce-type') || ''
        let body
        if (event === 'dev.runr.schedule.tick') {
          body = 'tick from JavaScript (Wasm)'
        } else if (event === 'dev.runr.queue.message') {
          body = `processed ${await request.text()} (from JavaScript, Wasm)`
        } else {
          const name = new URL(request.url).searchParams.get('name') || 'World'
          body = `Hello, ${name}! (from JavaScript, Wasm)`
        }
        console.log(body)
        return new Response(body, { status: 200, headers: { 'content-type': 'text/plain' } })
      }

      addEventListener('fetch', (event) => {
        event.respondWith(handle(event.request))
      })
build:
  # the image's node_modules serve the default package.json; a project's own package.json is installed
  command: >-
    if cmp -s package.json /opt/runr/js/package.json; then ln -sfn /opt/runr/js/node_modules node_modules;
    else npm install --no-audit --no-fund --prefer-offline; fi &&
    spin build
  source: false
  files:
    package.json: "@package.json"
    build.mjs: "@build.mjs"
    spin.toml: "@spin.toml"
run:
  mode: http
  schedule: native
  env:
    SPIN_HTTP_LISTEN_ADDR: "0.0.0.0:8080"
triggers: [http, schedule, queue]
resources:
  cpu: "100m"
  memory_mb: 128
runtimeClass: wasmtime-spin-v2
