# Secret scanning of the checked-out tree (CI: the gitleaks job of .github/workflows/ci.yml).
# Run locally: git archive HEAD | tar -x -C /tmp/runr-tree && gitleaks dir /tmp/runr-tree --config .gitleaks.toml

title = "RunR"

[extend]
useDefault = true

[[allowlists]]
description = "Self-signed throwaway TLS material used only by the API test suite"
paths = [
  '''(^|/)api/tests/''',
]

[[allowlists]]
description = "Made-up tokens, passwords and throwaway keys in the Go, UI and end-to-end test suites and in the seed data of the console screenshots"
paths = [
  '''_test\.go$''',
  '''(^|/)vue/e2e/''',
  '''(^|/)vue/tests/''',
  '''(^|/)vue/shots/''',
]

[[allowlists]]
description = "The deploy key of the dependency bot's test (ci/deps/ssh-key.sh): a made-up OpenSSH key"
condition = "AND"
paths = [
  '''(^|/)runtime/test/deps_bot_test\.sh$''',
]
regexes = [
  '''not-a-real-key''',
]

[[allowlists]]
description = "The CLI reference names the flag --secret-stdin=KEY (a key name, not a value)"
condition = "AND"
paths = [
  '''(^|/)docs/cli\.md$''',
]
regexTarget = "line"
regexes = [
  '''`--secret-stdin=KEY`''',
]
