# ─── Domain ───────────────────────────────────
# Host name of the console; sets APP_URL and FRONTEND_URL to https://<domain>, which is also the
# origin CORS allows (with cors.allowedOrigins). Empty: those values are not set.
domain: ""

# ─── CORS ─────────────────────────────────────
# The console calls the API on its own origin and needs no CORS. Other origins whose browser pages
# call the API (/api/*), e.g. ["https://portal.example.com"]: CORS_ALLOWED_ORIGINS.
cors:
  allowedOrigins: []

# ─── Gateway ─────────────────────────────────
# Single entry point: routes /, /api, /horizon, /ws
gateway:
  replicas: 2               # ignored while hpa.enabled: the HPA owns the count
  serviceType: ClusterIP
  port: 80
  # affinity of the gateway pods; empty: placement.affinity
  affinity: {}
  image:
    repository: ghcr.io/brf-tech/runr/reqs/caddy
    tag: "2-alpine"
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 250m, memory: 128Mi }
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70
  pdb:
    enabled: false

# ─── API ──────────────────────────────────────
api:
  image:
    repository: ghcr.io/brf-tech/runr/api
    # "" = the chart's appVersion: `helm install --version X` runs RunR X and `helm rollback` rolls
    # the images back with the chart. A tag set here (latest included) is used as it is
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2               # ignored while hpa.enabled: the HPA owns the count
  port: 80                  # port Octane listens on in the API container
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: "1", memory: "1Gi" }
  storage:
    size: 10Gi
    # Access modes of the PVC runr-api-storage, mounted by the API, Horizon, scheduler, Reverb and the
    # hook Jobs. ReadWriteOnce: one node at a time, those pods are colocated (podColocation).
    # [ReadWriteMany] with a ReadWriteMany StorageClass: they run on any node. Set when the claim is
    # created — Kubernetes does not change it later (docs/install.md, Storage).
    accessModes: [ReadWriteOnce]
    fixPermissions: true    # initContainer: chown www-data (some volume types, e.g. ext4 block volumes, come owned by root)
    # storageClassName: ""  # empty: the cluster's default StorageClass
  # affinity of the API pods; empty: placement.affinity
  affinity: {}
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 70
  pdb:
    # Created only with a ReadWriteMany API volume: with ReadWriteOnce the API pods cannot move off
    # the volume's node and a budget would hold a drain of that node forever.
    enabled: false

# ─── UI ───────────────────────────────────────
ui:
  image:
    repository: ghcr.io/brf-tech/runr/ui
    tag: ""                 # "" = the chart's appVersion, as api.image.tag
    # Appended to the tag when edition=multi-tenant: the UI variant built with the Tenancy and Auth
    # Provider modules (published as <version>-mt), <appVersion>-mt by default. The moving tag latest
    # has no such variant: it runs <appVersion>-mt too. "" = the tag as it is (a UI image of your own
    # with the modules)
    multiTenantSuffix: "-mt"
    pullPolicy: IfNotPresent
  replicas: 2               # ignored while hpa.enabled: the HPA owns the count
  port: 80                  # port Caddy listens on in the UI container
  # affinity of the UI pods; empty: placement.affinity
  affinity: {}
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 200m, memory: 128Mi }
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPU: 70
  pdb:
    enabled: false

# ─── Reverb (required, no toggle) ────────────
reverb:
  # More than 1: the replicas share broadcasts over Redis (REVERB_SCALING_ENABLED); each WebSocket
  # (console, browser shell, sandbox exec, region agent) stays on the replica it reached
  replicas: 1
  port: 8080                # port Reverb listens on (REVERB_SERVER_PORT) and of the Service
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }

# ─── Horizon ─────────────────────────────────
horizon:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: "1", memory: "1Gi" }

# ─── Scheduler ───────────────────────────────
scheduler:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits:   { cpu: 256m, memory: 256Mi }

# ─── Redis ───────────────────────────────────
# host empty → an internal Redis is installed
# host set   → that external Redis is used, no internal one is installed
redis:
  host: ""
  port: "6379"
  username: ""              # ACL user (REDIS_USERNAME); empty: the default user
  # Password (REDIS_PASSWORD, from a Secret): written to the chart's Secret (secretName), or read from
  # existingSecret / existingSecretPasswordKey. The chart's Redis then requires it too.
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: password
  image:
    repository: ghcr.io/brf-tech/runr/reqs/redis
    tag: "7-alpine"
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: 500m, memory: 512Mi }
  pdb:
    enabled: false

# ─── Database (PostgreSQL) ───────────────────
# host empty → an internal PostgreSQL is installed
# host set   → that external PostgreSQL is used, no internal one is installed
database:
  driver: pgsql             # the only driver: the pods share one database server
  host: ""
  port: "5432"
  name: runr
  user: runr
  # The user's password (DB_PASSWORD, from a Secret). Empty: generated by the chart on the first
  # install (secret.create=true) and kept. password: written to the chart's Secret; existingSecret /
  # existingSecretPasswordKey: read from a Secret of yours. The chart's PostgreSQL applies it when
  # it initialises an empty volume (later changes: ALTER USER first).
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: password
  postgres:
    image:
      repository: ghcr.io/brf-tech/runr/reqs/postgres
      tag: "17-alpine"
    storage: 10Gi
    storageClassName: ""    # StorageClass of runr-postgres-data; empty: the cluster's default (set at creation)
    fixPgdata: true         # initContainer: moves lost+found out of the way, PGDATA in a subdirectory
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits:   { cpu: "1", memory: "1Gi" }
    pdb:
      enabled: false

# ─── Disk sizes (shortcut) ───────────────────
# When set, used instead of api.storage.size / database.postgres.storage (e.g. from an install
# form). A PVC can grow, never shrink.
storage:
  application: ""
  database: ""

# ─── Organization CPU / RAM ceiling ──────────
# 0 or empty → no ceiling.
# Applied to every region's project namespace as a ResourceQuota (CPU: requests = ceiling — the
# queue-proxy CPU burst of project pods is not reserved; memory: requests/limits = ceiling) plus a
# LimitRange (default request/limit). In the multi-tenant edition it is the default tenant quota
# and the upper bound of the sum of tenant quotas on a region.
quota:
  cpu: 0          # vCPU, e.g. 8 or 0.5
  memoryGiB: 0    # GiB, e.g. 16

# ─── Mail ────────────────────────────────────
# host empty → Mailpit is installed (dev/staging SMTP catch-all)
# host set   → that external SMTP server is used, no Mailpit
mail:
  host: ""
  port: "1025"
  from: "noreply@runr.sh"
  fromName: RunR
  # SMTP authentication: username (MAIL_USERNAME) and the password (MAIL_PASSWORD, from a Secret) —
  # written to the chart's Secret, or read from existingSecret / existingSecretPasswordKey
  username: ""
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: password
  # "" or starttls: STARTTLS when the server offers it (TLS from the first byte on port 465);
  # tls: TLS from the first byte on any port
  encryption: ""

mailpit:
  image:
    repository: ghcr.io/brf-tech/runr/reqs/mailpit
    tag: latest
  uiPort: 8025
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits:   { cpu: 100m, memory: 64Mi }

# ─── App Config ──────────────────────────────
app:
  env: production
  debug: "false"
  logChannel: stderr

queue:
  connection: redis

cache:
  store: redis

# ─── Edition ─────────────────────────────────
# single-tenant: one organization · multi-tenant: Tenancy + Auth Provider modules on
edition: single-tenant

tenancy:
  enabled: false

authProvider:
  enabled: false

# Support tickets: the Ticket module of the API (TICKET_ENABLED). The console shows the ticket pages
# when its UI image is built with VITE_TICKET_ENABLED=true.
ticket:
  enabled: true

# ─── Billing (docs/billing.md) ───────────────
# The Billing module of the API (BILLING_ENABLED), off by default. On: RunR calculates a bill per
# project and month (payer: the project owner) from region prices — pay-as-you-go usage or fixed
# resources — and, with tenancy, a bill per tenant for its use of shared platform regions. RunR only
# calculates: an external invoicing system reads bills and usage through the billing API and gets
# signed events on webhookUrl (empty: events are only kept for GET /api/billing/events). webhookSecret
# signs them (X-RunR-Signature: sha256=HMAC-SHA256(secret, "<X-RunR-Timestamp>.<raw body>")); it goes
# into the chart's Secret (secretName) — with secret.create=false add the key BILLING_WEBHOOK_SECRET to
# that Secret yourself (optional). A webhook saved in the console (Administration → Billing → Webhook)
# wins over these two values. The console shows the billing pages when the API reports billing on (the
# published UI images are built with VITE_BILLING_ENABLED=true).
billing:
  enabled: false
  # ISO 4217 currency of every price and bill of the installation
  currency: USD
  webhookUrl: ""
  webhookSecret: ""

# ─── Branding (white-label, docs/white-label.md) ─
# The installation's brand — no rebuild, applied when the pods start. Precedence (per field):
# value saved in Administration → Branding > this value > the RunR default (RunR by BRF Teknoloji).
# "Reset to default" in the console brings a field back to this value.
# Logo / favicon: an https URL, a data:image/...;base64,... URI or a reference to a key of an
# existing ConfigMap / Secret in the release namespace (content: URL, data: URI or raw <svg>; ≤ ~700 KB):
#   logo:
#     light: { configMapKeyRef: { name: my-brand, key: logo-light.svg } }
#     dark:  { secretKeyRef: { name: my-brand-secret, key: logo-dark } }
branding:
  productName: ""          # empty: RunR
  companyName: ""          # empty: BRF Teknoloji
  logo:
    light: ""              # light theme / e-mails
    dark: ""               # dark themes / login page
    mark: ""               # square icon
  favicon: ""
  colors:
    # One base colour "#rrggbb" (shade 500; 300–900 are derived) or the full scale:
    #   primary: { "300": "102 197 237", "400": "51 181 233", "500": "0 159 227", "600": "0 123 192",
    #              "700": "0 85 184", "800": "0 68 153", "900": "0 43 128" }   # "Ocean" example preset
    primary: ""            # empty: RunR orange (#f97316 scale)
    accent: ""             # empty: #e63946
  loginHeadline: ""
  loginText: ""
  supportUrl: ""
  supportEmail: ""
  footerLinks: []          # [{label: Status, url: https://status.example.com}]
  poweredBy: true          # "Powered by RunR" on a re-branded login page / in e-mails
  email:
    fromName: ""           # empty: productName
    logo: ""               # empty: logo.light (data: URIs reach mail clients through /api/branding/assets)
  tenantOverrides: true    # multi-tenant: tenant owners may brand what their users see

# ─── Self-service signup (docs/white-label.md) ─
# registration_enabled is a separate runtime setting and stays on by default (Administration →
# Regions & settings → User Registration).
signup:
  emailVerification: false # on: the account is created when the e-mail link is opened
  verificationTtlHours: 48
  allowedDomains: ""       # comma-separated: "example.com,*.example.org"; empty = any domain
  inviteOnly: false        # invitations only (tenant invitations / accounts created by an admin)
  captcha:
    provider: none         # none | turnstile | hcaptcha
    siteKey: ""
    secret: ""             # Secret: SIGNUP_CAPTCHA_SECRET
  termsUrl: ""
  privacyUrl: ""
  # multi-tenant: every signup gets its own tenant; the onboarding wizard (organization name,
  # region, plan) runs at the first sign-in
  tenantAutoCreate: true
  defaultQuota:
    cpuM: 2000
    memoryMb: 4096
  regions: ""              # platform region ids offered in the wizard (comma-separated); empty = all active regions

knative:
  minK8sMinor: "30"
  # Image of the region Traefik (Knative ingress); empty: ghcr.io/brf-tech/runr/reqs/traefik at the version
  # of the pinned chart (the mirror of docker.io/traefik). Point it at a registry the regions reach,
  # with the same Traefik version; `region:reconcile` moves existing regions to it.
  traefikImage: ""
  # cert-manager in the regions: the certificates of project custom domains (TLS mode cert-manager,
  # docs/regions.md#cert-manager). A cluster that runs cert-manager keeps it (reused, never removed
  # by RunR); RunR installs jetstack/cert-manager v1.21.2 (images from ghcr.io/brf-tech/runr/reqs)
  # where there is none, then a default ClusterIssuer: ACME (Let's Encrypt, HTTP-01 through the
  # region Traefik) in regions reachable from the internet once an ACME e-mail is set, else a
  # region CA the operator can trust. `region:reconcile` brings existing regions there.
  certManager:
    install: true          # false: only a cluster's own cert-manager is used
    acmeEmail: ""          # ACME account e-mail (accepts the ACME server's terms); empty: the region CA everywhere
    acmeServer: ""         # empty: Let's Encrypt production
    chartVersion: ""       # empty: the pinned chart
    imagePrefix: ""        # <prefix>/cert-manager-<component>:<version>; empty: the reqs mirror

# ─── Observability (docs/observability.md) ───
# Tracing backend per region (OpenTelemetry Collector + Grafana Tempo, installed with Knative
# Serving; each region can reuse an in-cluster Tempo, export OTLP elsewhere or switch tracing off
# in the console), request replay, uptime checks, the public status page and alert delivery.
observability:
  tracing:
    # managed | reuse | external | off — regions without their own setting. With installWithServing
    # it also decides whether `region:reconcile` installs the backend on such a region
    defaultMode: managed
    installWithServing: true      # install the backend together with Knative Serving
    knativeSampleRate: 0.1        # activator / queue-proxy span sampling (region setting overrides)
    tempoRetentionHours: 72
    tempoStorage: 10Gi
    # Chart versions; empty: the ones this release pins — open-telemetry/opentelemetry-collector
    # 0.176.0 (collector 0.162.0, contrib image) and grafana-community/tempo 3.2.0 (Tempo 3.1.0,
    # single binary)
    collectorChartVersion: ""
    tempoChartVersion: ""
    # Images of the collector and Tempo; empty: ghcr.io/brf-tech/runr/reqs/opentelemetry-collector-contrib
    # and ghcr.io/brf-tech/runr/reqs/tempo at the versions of the pinned charts (the mirrors of
    # docker.io/otel/opentelemetry-collector-contrib and docker.io/grafana/tempo). Point them at a
    # registry the regions reach, with the same versions; `region:reconcile` moves installed
    # backends to them.
    collectorImage: ""
    tempoImage: ""
  replay:
    maxBodyBytes: 65536           # project default; projects choose up to 1 MiB
    retentionDays: 7              # project default; projects choose up to 30
    maxCaptures: 500              # per project, oldest dropped first
    ingestUrl: ""                 # RunR as seen from region pods; empty: the region's agent URL
  uptime:
    minIntervalSeconds: 30
    resultsRetentionDays: 90
    allowPrivateTargets: false    # true: checks of an absolute URL may target private addresses
  # Load tests of HTTP projects (docs/load-test.md): a k6 Job in the project's region against the
  # project's own URL; the test traffic is metered like any other traffic
  loadTest:
    enabled: true
    dailyLimit: 20                # tests an organization may start per day (0: none)
    maxUsers: 100                 # the largest of the 10 / 50 / 100 user choices offered
    maxDurationSeconds: 300       # the longest of the 30 / 60 / 300 s choices offered
    maxConcurrentPerRegion: 5     # k6 pods at once in a region (ResourceQuota of runr-loadtest)
    # The k6 image; empty: ghcr.io/brf-tech/runr/reqs/k6 at the pinned version (the mirror of
    # docker.io/grafana/k6). Point it at a registry the regions reach, with the same version
    image: ""
  statusPage:
    enabled: true
  alerts:
    deliveryTries: 4
    allowPrivateTargets: false    # true: webhook / Slack / Teams URLs may be private addresses

# ─── Sandbox API (docs/sandbox-api.md) ───────
# Isolated execution of untrusted code (AI agents, code interpreters): plain pods in a namespace per
# organization under each region's strongest sandbox class (Kata > gVisor; runc only where a region
# allows it). Region settings, warm pools and organization quotas are set in Build & Run → Sandbox
# settings; the values below are the platform defaults and ceilings.
sandboxApi:
  enabled: true
  namespacePrefix: runr-sbx       # namespace "<prefix>-<organization>" per region
  defaultRuntime: python
  allowCustomImages: true         # `image` instead of a runtime of the catalog
  defaults:
    cpuM: 500
    memoryMb: 512
    diskMb: 1024
    ttlSeconds: 900
    idleTimeoutSeconds: 600
  limits:                         # per sandbox; a region may lower them
    maxCpuM: 4000
    maxMemoryMb: 8192
    maxDiskMb: 10240
    maxTtlSeconds: 86400
  quota:                          # per organization unless set in Sandbox settings; 0 = unlimited
    maxConcurrent: 20
    maxCpuM: 8000
    maxMemoryMb: 16384
    maxSandboxSecondsMonth: 0
    maxPoolSize: 10
  exec:
    defaultTimeout: 60
    maxTimeout: 3600
  files:
    maxUploadBytes: 52428800
    maxDownloadBytes: 52428800
  poolMaxAgeSeconds: 3600         # warm pods are replaced after this
  retentionDays: 30               # ended sandboxes are removed after this

# ─── Git deploy (docs/git-deploy.md) ─────────
# Every project gets a git remote https://<domain>/git/<organization>/<project>.git (served by
# runr-api behind runr-gateway's /git route); GitHub / GitLab / Forgejo providers are added in
# Data & Integrations → Git providers. Remotes live on the api-storage volume (git-remotes/).
gitDeploy:
  enabled: true
  maxPushMb: 50           # largest pack one push may send (stay below the API's 64 MB body limit)
  remoteOwner: runr       # owner segment of remote URLs in the single-organization edition
  webhookBaseUrl: ""      # empty: https://<domain>; set when providers reach the console elsewhere
  previews:
    limit: 3              # default live previews per project (project setting)
    ttlHours: 72          # default hours a preview lives without a new commit
    maxLimit: 20          # highest per-project preview limit

# ─── Software supply chain (docs/supply-chain.md) ─
# SBOM (syft), vulnerability scan (Trivy), cosign signatures and the sigstore policy-controller
# admission policy per region. What runs in a region is set in the UI (Region → Supply chain);
# these are the platform-wide defaults and images. Empty values keep the application defaults.
# New regions start with SBOM + scan on; regions that existed before the upgrade keep them off
# until an administrator enables them (publish / mirror toolsImage first).
supplyChain:
  enabled: true                 # build-ready hooks: every RunR-built image gets its supply-chain run
  toolsImage: ""                # default ghcr.io/brf-tech/runr/supply-chain:1.0.0 (ci.sh supply-chain)
  jobNamespace: ""              # default runr-supply-chain (Jobs + region signing key, per region)
  rescanHours: ""               # default re-scan interval of deployed images for new regions (24)
  trivyDbSource: ""             # mirror source of the vulnerability DB (mirror.gcr.io/aquasec/trivy-db:2)
  trivyJavaDbSource: ""         # mirror source of the Java DB (mirror.gcr.io/aquasec/trivy-java-db:1)
  trivyDbRefreshHours: ""       # refresh interval of mirrored DBs (12)
  policyController:
    helmRepo: ""                # default https://sigstore.github.io/helm-charts
    chartVersion: ""            # default pinned in config/supply_chain.php
    extraArgs: ""               # webhook flags, e.g. "disable-tuf=true" for regions without internet

# ─── Global projects and global DNS (docs/global-projects.md) ─
# A global project runs in several regions behind <slug>.<zone>. Every platform region that takes
# part runs a small PowerDNS server for the zone (enabled per region: Region → General → Global
# DNS); the operator delegates the zone to them once. Empty values keep the application defaults.
globalDns:
  zone: ""                      # default g.<base domain> (Administration → Regions & settings → Base Domain)
  namespace: ""                 # namespace of the PowerDNS server in a region (default runr-global-dns)
  image: ""                     # default ghcr.io/brf-tech/runr/reqs/pdns-auth:5.0.8
  storageClass: ""              # the server's 1Gi volume; empty: the cluster default
  serviceAnnotations: {}        # annotations of the DNS LoadBalancer Service (UDP + TCP 53)
  ttl: ""                       # TTL of the project records in seconds (default 30)
  maxRegions: ""                # regions of one global project (default 8)
  # GeoIP database of proximity mode: a gzipped MaxMind-format city database, {yyyy}/{mm} = the
  # current month. Default DB-IP "IP to City Lite" (CC BY 4.0); "-" = none (proximity answers
  # without a preferred region); a MaxMind GeoLite2 download URL with your license key works too.
  geoipUrl: ""
  tls:
    mode: ""                    # acme (default: the region's cert-manager, DNS-01 for *.<zone> in every region) | none
    acmeServer: ""              # default Let's Encrypt production
    acmeEmail: ""               # contact address of the ACME account; empty: knative.certManager.acmeEmail
  failover:
    afterSeconds: ""            # a primary whose health check failed this long fails over (automatic projects); default 180
  dataLink:
    image: ""                   # forwarder of a binding's data link in the other regions; default ghcr.io/brf-tech/runr/reqs/nginx:1.27-alpine
    port: ""                    # port of the home region's Traefik the link reaches (TLS, SNI); default 443

# ─── Uploaded images (docs/images.md) ─
# Container images (docker save / OCI layout tars) and .wasm modules uploaded through the console,
# the API or `runr images push` into a region's internal registry. Empty values keep the defaults.
images:
  uploadImage: ""              # receiver image the regions pull (default ghcr.io/brf-tech/runr/image-upload:1.1.0, ci.sh image-upload)
  quotaGb: ""                  # storage of uploaded images per organization over every region (default 50, 0 = unlimited)
  maxUploadGb: ""              # largest file of one upload (default 20)
  uploadTtlHours: ""           # an upload not completed within this time is aborted (default 24)

# ─── Runtime patches (docs/runtimes.md#runtime-patches, docs/security.md#runtime-patch-feed) ─
# One signed feed (an OCI artifact signed with cosign) announces the patch tags of the runtime
# images: level, reason, CVEs and — for critical and zero-day patches — a deadline. RunR checks the
# feed's digest every five minutes and verifies its signature with publicKey; without a key the
# feed is off and platform administrators see a warning. Empty values keep the application defaults.
runtimePatches:
  feed: ""                     # OCI reference of the feed (default ghcr.io/brf-tech/runr/runtime-patches:feed)
  # cosign public key (PEM) the feed is signed with: runr-runtimes' feed key (keys/patch-feed.pub
  # there). Another key for a feed of your own; "" switches the feed off
  publicKey: |
    -----BEGIN PUBLIC KEY-----
    MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEGdKhMmbBAKxXJUxpxtBRgGQstN8y
    sa4lqGU1wKXXWEQ3hEPCdQNbBoDmTDgC4XRxI6sXfxJ9V6eslYxKgITcRw==
    -----END PUBLIC KEY-----
  viaRegion: ""                # read the feed through this region's registry (id or name): an API without a way out
  autoMigrate: true            # at a critical / zero-day deadline, redeploy the projects still behind onto the patch
                               # (the default; platform administrators switch it on the Patches page)

# ─── API product of the gateways (docs/api-product.md) ─
# API keys, JWT routes, plans and usage per consumer: the regions run gateway-auth, which the
# region Traefik asks before every call of a key / JWT route. Empty values keep the defaults.
apiProduct:
  gatewayAuthImage: ""         # gateway-auth image the regions pull (default ghcr.io/brf-tech/runr/gateway-auth:1.0.0, ci.sh gateway-auth)
  callbackUrl: ""              # RunR's base URL as the regions reach it (default: the region agent's URL)
  syncSeconds: ""              # how often gateway-auth fetches changed keys / plans (default 10)
  usageRetentionDays: ""       # hourly usage rows kept (default 400)

# ─── Organization export / import (docs/org-export.md) ─
# Packages live on the API volume (api.storage.size / storage.application): size it for what you
# export, or write exports to an object binding / S3. Empty values keep the defaults.
orgTransfer:
  transferImage: ""            # transfer agent the regions pull for binding data and images (default ghcr.io/brf-tech/runr/image-upload:1.1.0)
  maxPackageGb: ""             # largest package an import takes (default 50)
  retentionHours: ""           # packages are removed after (default 168)
  podDiskGb: ""                # emptyDir of a transfer pod: one binding's dump or one image (default 20)

# ─── AI: GPU support and Hugging Face models (docs/ai.md, docs/huggingface.md) ─
# Images and charts the regions pull. Point them at a registry the regions reach for
# air-gapped installations; the defaults are the public upstream images.
ai:
  huggingface:
    # Hub API of the console's model browser and of online model downloads (a mirror with the same API works)
    endpoint: https://huggingface.co
    # false: the console does not call the Hub (air-gapped console); models are uploaded or imported
    browse: true
  images:
    hfServe: ghcr.io/brf-tech/runr/hf-serve:1.1.1
    hfServeCuda: ghcr.io/brf-tech/runr/hf-serve:1.1.1-cuda
    vllm: docker.io/vllm/vllm-openai:v0.6.6
    tgi: ghcr.io/huggingface/text-generation-inference:3.0.1
    teiCpu: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    # {arch} from the GPU's compute capability: turing- | "" | 86- | 89- | hopper- | 100- | 120- | 121- | cuda- (any other)
    teiGpu: "ghcr.io/huggingface/text-embeddings-inference:{arch}1.9.4"
    oras: ghcr.io/oras-project/oras:v1.2.0
  gpu:
    devicePluginChartVersion: "0.17.0"
    operatorChartVersion: "v24.9.2"
    # Default timeout (s) of GPU projects and model services
    defaultTimeout: 300
    # Revision start-up deadline of GPU workloads and model services (image pull + model load)
    progressDeadline: 1800s
    # GPU pods stay this long after the last request before they scale to zero
    scaleToZeroRetention: 5m
  modelStorage:
    # Default size (GiB), access mode and storage class of a region's model volume (PVC runr-models);
    # each region can change them before its first model
    sizeGi: 100
    accessMode: ReadWriteMany
    storageClass: ""

# ─── Bindings (docs/bindings.md) ─────────────
# Managed KV, object storage and Postgres that projects attach to. The data services are
# installed per region from the console (Region → Data services) into `namespace`; these are
# their defaults and the per-organization limits (per tenant in multi-tenant installs).
bindings:
  namespace: runr-data
  retentionDays: 7            # a deleted binding keeps its data this long (restore possible)
  rotationGraceSeconds: 600   # old credentials keep working this long after a rotation
  storageClass: ""            # PVCs of the data services; empty = the cluster default
  quotas:                     # 0 = unlimited
    maxBindings: 20
    kvMb: 1024
    objectGb: 100
    postgresGb: 50
    dedicatedPostgres: 2
  kv:
    maxmemoryMb: 512          # managed KV Redis: memory (noeviction) and AOF volume
    storage: 2Gi
  object:
    image: ghcr.io/brf-tech/runr/reqs/garage:v2.1.0
    storage: 20Gi
    s3Region: garage
  postgres:
    cnpgChartVersion: "0.26.0"
    image: ghcr.io/cloudnative-pg/postgresql:17.5
    sharedInstances: 1
    sharedStorage: 10Gi
    backupRetention: 7d

# ─── Secret ──────────────────────────────────
# One Secret: APP_KEY + REVERB_APP_SECRET + DB_PASSWORD (+ ADMIN_PASSWORD, MAIL_PASSWORD, REDIS_PASSWORD)
# create: true → the chart generates it (default) and keeps the generated values on upgrade; the
#   passwords of an external database, SMTP server or Redis come from database/mail/redis.password
#   or .existingSecret. false → create it before installing (ci.sh / CI deploy)
secretName: runr-secret
secret:
  create: true
  # APP_KEY encrypts secrets at rest (env vars, kubeconfigs, credentials — docs/security.md).
  # Empty: generated at install and kept on upgrade. Key rotation: set appKey to the new key
  # ("base64:" + 32 random bytes, base64) and previousAppKeys to the old one, upgrade, run
  # `php artisan secrets:encrypt --rotate` in the api pod, then clear previousAppKeys and upgrade again.
  appKey: ""
  # Comma-separated earlier keys (APP_PREVIOUS_KEYS): values encrypted with them still decrypt.
  # Present only while set here. With secret.create=false add APP_PREVIOUS_KEYS to your Secret.
  previousAppKeys: ""

# ─── Project secrets (docs/security.md, docs/secret-stores.md) ──
projectSecrets:
  # Where RunR writes the value of a project's secret variable (env RUNR_SECRET_STORAGE):
  #   region   (default) straight into the Kubernetes Secret of the project's region; RunR's
  #            database keeps the name, version and a keyed fingerprint, never the value
  #   database the behaviour up to 0.5.10, values encrypted in RunR's database (deprecated)
  # Values written by 0.5.10 or earlier keep working; the bootstrap Job moves them into the
  # regions after every upgrade (`php artisan secrets:move-to-region`, docs/upgrade.md).
  storage: region
  # An install upgraded from 0.5.10 keeps an encrypted copy of every secret value in its database,
  # so that the 0.5.10 chart can be installed again (helm rollback, or the previous package) without
  # its deploys writing empty values; secret store references wait for it. Once the upgrade is
  # confirmed, set true: the bootstrap Job runs `secrets:move-to-region --finalize`, which checks
  # every value in its region and drops the copies. After that, do NOT install 0.5.10 again.
  # Fresh installs start finalized; the value changes nothing there.
  finalize: false

# ─── Audit log (docs/security.md) ────────────
audit:
  # Events older than this are deleted daily (0 = keep forever); the platform setting in
  # Administration → Audit log overrides it
  retentionDays: 365
  # SIEM forwarding: every audit event also goes to the api / horizon / reverb container log
  # (stdout) as one JSON line ({"log_type":"runr.audit", …}) for a log collector to ship
  siemForwarding: false

# ─── Sign-in sessions (docs/security.md) ─────
auth:
  # Days a sign-in to the console or the CLI stays valid, counted from the sign-in
  # (env RUNR_LOGIN_TOKEN_TTL_DAYS); it applies to sessions signed in earlier as well.
  # 0 = until signed out. API tokens keep the expiry they were created with.
  loginTokenTtlDays: 30

# ─── First administrator account ─────────────
# password empty: generated randomly into the Secret (ADMIN_PASSWORD) when secret.create=true;
# with secret.create=false ADMIN_PASSWORD of your Secret, else the bootstrap Job generates one into
# the Secret runr-admin (key password). Never written to a log.
admin:
  username: admin
  email: admin@example.com
  password: ""

# ─── Bootstrap (post-install / post-upgrade hook) ─
# Runs after the migrate hooks: brings the existing regions to this version and creates the
# administrator above when no administrator exists (AdminSeeder + is_admin). Leaves existing
# accounts alone. false → the Job is not rendered (ci.sh / the CI deploy run their own admin step)
bootstrap:
  enabled: true
  # Multi-tenant edition: an installation that ran single-tenant becomes its first tenant
  # (php artisan tenancy:setup --force: name Default, slug the git remote owner). Fresh, converted
  # and multi-tenant installations are left alone. false → run tenancy:setup yourself (to review
  # the plan with --dry-run first or choose --name / --slug; docs/tenancy.md)
  tenancySetup: true
  # The Job runr-region-reconcile-<revision> brings the regions to the release after helm upgrade
  # returned (not a hook: helm does not wait for it). Seconds each of its three attempts may start
  # region:reconcile steps for (--deadline; the step running then runs to its end, up to 30 minutes
  # more). 3600 covers the worst case of one region cluster on an upgrade from 0.5.10; a typical
  # cluster takes 5-10 minutes. Steps the deadline leaves are done by the next attempt; raise it for
  # installations with many region clusters (the Job's activeDeadlineSeconds follows; docs/upgrade.md)
  regionReconcileSeconds: 3600

# ─── Ingress ─────────────────────────────────
# domain → runr-gateway. className: the cluster's ingress class (traefik on k3s)
ingress:
  enabled: true
  className: traefik
  # With ingress-nginx, MCP streams (SSE on /mcp, docs/mcp.md) need
  #   nginx.ingress.kubernetes.io/proxy-buffering: "off"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
  annotations: {}
  tls:
    # Console certificate:
    #   letsencrypt — issued by cert-manager: annotation cert-manager.io/cluster-issuer: <clusterIssuer> on the
    #                 Ingress + tls (secretName). Behaves like none when the cluster has no cert-manager.
    #   custom      — certificate + privateKey (PEM) → the chart creates a kubernetes.io/tls Secret.
    #   secret      — your own kubernetes.io/tls Secret (secretName, required) in the release namespace.
    #   none        — no tls on the Ingress; the ingress controller serves its default certificate (e.g. Traefik TLSStore default).
    #   ""          — the older keys apply: enabled / clusterIssuer / secretName (0.3.5 and earlier, --reuse-values).
    mode: ""
    enabled: false        # only with mode ""
    secretName: ""        # empty: letsencrypt → runr-tls · custom → runr-tls-custom · secret: required
    clusterIssuer: ""     # letsencrypt: empty → letsencrypt-prod · mode "": when set, cert-manager issues the certificate
    certificate: ""       # custom: full PEM chain (server certificate first); base64-encoded PEM works too
    privateKey: ""        # custom: the certificate's unencrypted private key (PEM); never written to any output

# ─── Client IP (X-Forwarded-For) ─────────────
# Request path: client → ingress controller (Traefik) → runr-gateway (Caddy) → runr-api. The API takes
# the client IP — per-IP rate limits, IPs in logs and audit records — from X-Forwarded-For only as far
# as these proxies wrote it: the entry the ingress controller appended. What a client puts in the
# header itself never counts, and a peer outside trustedProxies is the client itself.
clientIp:
  # Addresses the proxies connect from: CIDRs, comma-separated. private_ranges = RFC 1918, IPv6 ULA,
  # loopback and link-local — covers the pod network of any cluster. runr-gateway keeps (and appends
  # to) the X-Forwarded-For of an ingress controller in these ranges; runr-api (env TRUSTED_PROXIES)
  # accepts it from a gateway in them. A narrower value is the cluster's pod CIDR, e.g. 10.42.0.0/16.
  trustedProxies: "private_ranges"
  # Proxies in front of runr-api that append to X-Forwarded-For (env TRUSTED_PROXY_HOPS).
  # 0 = automatic: 2 with the chart's Ingress (ingress controller + runr-gateway), 1 without it
  # (runr-gateway exposed directly; it then replaces X-Forwarded-For with the connecting address).
  # Add 1 per HTTP proxy in front of the ingress controller whose X-Forwarded-For the ingress
  # controller keeps (Traefik forwardedHeaders.trustedIPs; RunR's region Traefik: the region setting
  # ingress_trusted_ips), e.g. an L7 load balancer. A load balancer that sends PROXY protocol adds
  # no hop: the ingress controller then records the client address itself.
  proxyHops: 0

# ─── Custom env override ─────────────────────
# Written to the ConfigMap runr-config: no secrets here (passwords: database/mail/redis.password or
# .existingSecret)
extraEnv: {}

# ─── Pod Colocation ─────────────────────────────
# With a ReadWriteOnce API volume (api.storage.accessModes), the pods that mount it run on its node
# (required pod affinity). No effect with ReadWriteMany.
podColocation: true

# ─── Network policies ───────────────────────────
# true → NetworkPolicies that allow exactly the connections docs/install.md lists and deny the rest
# (needs a CNI that enforces NetworkPolicy)
networkPolicy:
  enabled: false
  # Who may reach runr-gateway (gateway.port): NetworkPolicy peers, e.g. the ingress controller's
  # namespace  - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
  # Empty: any source (an ingress controller on the host network, gateway.serviceType LoadBalancer)
  gatewayFrom: []
  # Outbound connections of the API, Horizon, scheduler and Reverb pods and the hook Jobs besides the
  # chart's services, DNS and the external database / Redis / SMTP port: the regions' Kubernetes API
  # servers, function domains, registries, Helm repositories, ghcr.io, git providers, alert targets
  egress:
    to:
      - ipBlock: { cidr: 0.0.0.0/0 }
      - ipBlock: { cidr: "::/0" }
    ports: [80, 443, 6443]  # empty: every port
  # Further egress rules of those pods (NetworkPolicyEgressRule), e.g. a region registry's NodePort
  extraEgress: []

# ─── Placement ──────────────────────────────────
# Where RunR's own pods run (every Deployment and hook Job of the chart).
placement:
  # A region on this cluster can select nodes as dedicated workers: RunR labels and taints them
  # runr.dev/dedicated=projects:NoSchedule. true → RunR's pods tolerate that taint and prefer the
  # other nodes (preferred node affinity), so a pod whose volume (PostgreSQL, the API storage) is
  # bound to a node selected later still starts there. Added to the values below.
  tolerateDedicatedWorkers: true
  # Added to every RunR pod as given, e.g. [{key: dedicated, operator: Equal, value: infra, effect: NoSchedule}]
  tolerations: []
  # affinity of every RunR pod (nodeAffinity, podAffinity, podAntiAffinity) unless gateway.affinity,
  # api.affinity or ui.affinity replaces it for that component; podColocation and
  # tolerateDedicatedWorkers add their terms to it
  affinity: {}
  # nodeSelector of every RunR pod, e.g. {node-role.kubernetes.io/infra: "true"}
  nodeSelector: {}

# ─── Deploy Timestamp ───────────────────────────
# Set by ci.sh deploy; triggers a rollout on every deploy
deployTimestamp: ""

# ─── Init Container Image ───────────────────────
# initContainer image (fix-permissions / fix-pgdata)
# ghcr.io/brf-tech/runr/reqs/busybox mirrors docker.io/library/busybox (lib/mirror.sh of BRF-Tech/runr-runtimes); only the "latest" tag exists
initImage:
  repository: ghcr.io/brf-tech/runr/reqs/busybox
  tag: "latest"

# ─── Cluster ─────────────────────────────────
# Pull secrets added to every pod (deployments, hook jobs, UI): ["regcred"] or [{name: regcred}]
imagePullSecrets: []
# true → the imagePullSecrets of the "default" ServiceAccount in the release namespace are added too (lookup).
# Platforms that attach their pull secret to the default ServiceAccount then work without knowing its name.
imagePullSecretsFromDefaultServiceAccount: true
# namespace empty → the Helm release namespace (default; ci.sh deploy sets it explicitly)
namespace: ""
# false → no Namespace objects are created (the platform / helm creates the namespace)
createNamespace: false
projectNamespace: runr-projects
