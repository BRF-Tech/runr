{{- if not .Values.redis.host }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runr-redis
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-redis
    {{- include "runr.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runr-redis
  template:
    metadata:
      labels:
        app: runr-redis
    spec:
      automountServiceAccountToken: false
      {{- include "runr.imagePullSecrets" . | nindent 6 }}
      {{- include "runr.placement" (dict "root" . "colocate" false) | nindent 6 }}
      containers:
        - name: redis
          image: {{ include "runr.image" (printf "%v:%v" .Values.redis.image.repository .Values.redis.image.tag) | quote }}
          {{- /* redis.password / redis.existingSecret: the chart's Redis requires the password the app pods send */}}
          {{- $password := include "runr.passwordRef" (dict "root" . "values" .Values.redis "key" "REDIS_PASSWORD") | fromJson }}
          {{- if $password.name }}
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $password.name | quote }}
                  key: {{ $password.key | quote }}
          {{- end }}
          ports:
            - containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: runr-redis
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-redis
    {{- include "runr.labels" . | nindent 4 }}
spec:
  selector:
    app: runr-redis
  ports:
    - port: 6379
      targetPort: 6379
{{- end }}
