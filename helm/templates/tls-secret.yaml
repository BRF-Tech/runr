{{/*
  ingress.tls.mode=custom: the certificate (full chain) + private key uploaded by the customer → kubernetes.io/tls Secret.
  The Ingress (ingress.yaml) references this Secret; cert-manager is not involved.
*/}}
{{- if and .Values.ingress.enabled .Values.domain }}
{{- $t := include "runr.ingressTls" . | fromJson }}
{{- if eq $t.mode "custom" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $t.secret }}
  namespace: {{ include "runr.namespace" . }}
  labels:
    {{- include "runr.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ include "runr.pemB64" (dict "value" .Values.ingress.tls.certificate "field" "ingress.tls.certificate" "marker" "CERTIFICATE") }}
  tls.key: {{ include "runr.pemB64" (dict "value" .Values.ingress.tls.privateKey "field" "ingress.tls.privateKey" "marker" "PRIVATE KEY") }}
{{- end }}
{{- end }}
