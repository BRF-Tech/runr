apiVersion: apps/v1
kind: Deployment
metadata:
  name: runr-ui
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-ui
    {{- include "runr.labels" . | nindent 4 }}
spec:
  {{- with include "runr.replicas" (dict "root" . "name" "runr-ui" "replicas" .Values.ui.replicas "hpa" .Values.ui.hpa) }}
  {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app: runr-ui
  template:
    metadata:
      labels:
        app: runr-ui
      annotations:
        {{- include "runr.checksum" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- include "runr.imagePullSecrets" . | nindent 6 }}
      {{- include "runr.placement" (dict "root" . "colocate" false "affinity" .Values.ui.affinity) | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "runr.uiImage" . | quote }}
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.ui.port }}
          env:
            # Port Caddy listens on (vue/Caddyfile)
            - name: RUNR_UI_PORT
              value: {{ .Values.ui.port | quote }}
            # The platform's branding defaults (branding.colors.*, branding.defaultTheme): the
            # entrypoint writes them to /branding-defaults.js, so a first visit opens in the
            # platform's theme and colours before GET /api/branding answers. The API's keys of
            # runr-config, one source for both (vue/docker-entrypoint.sh validates them)
            {{- range $key := list "BRANDING_PRIMARY_COLOR" "BRANDING_PRIMARY_SCALE" "BRANDING_ACCENT_COLOR" "BRANDING_DARK_COLOR" "BRANDING_DARK_SCALE" "BRANDING_LIGHT_COLOR" "BRANDING_LIGHT_SCALE" "BRANDING_DEFAULT_THEME" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: runr-config
                  key: {{ $key }}
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.ui.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: runr-ui
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-ui
    {{- include "runr.labels" . | nindent 4 }}
spec:
  selector:
    app: runr-ui
  ports:
    - port: 80
      targetPort: {{ .Values.ui.port }}
