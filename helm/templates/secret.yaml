{{/*
  In a marketplace install the chart generates the secret (secret.create: true).
  Values are generated randomly on the first install; on upgrade they are read from the existing secret (lookup),
  so APP_KEY / REVERB_APP_SECRET / DB_PASSWORD do not change. If admin.password is given, it is used.
  database.password, mail.password and redis.password are written here while they are set (the
  passwords of an external database, SMTP server and Redis); with database.existingSecret /
  mail.existingSecret / redis.existingSecret the pods read that Secret instead (runr.passwordRef).
  Default secret.create: true. ci.sh deploy (deploy.sh) and the CI deploy create the secret themselves,
  so they pass secret.create=false.
*/}}
{{- if .Values.secret.create }}
{{- $ns := include "runr.namespace" . }}
{{- $existing := (lookup "v1" "Secret" $ns .Values.secretName) }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "runr.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* APP_KEY encrypts secrets at rest (docs/security.md). secret.appKey replaces it (key rotation:
         move the old key to secret.previousAppKeys, then run `php artisan secrets:encrypt --rotate`). */}}
  {{- $secretValues := .Values.secret | default dict }}
  {{- if $secretValues.appKey }}
  APP_KEY: {{ $secretValues.appKey | b64enc }}
  {{- else }}
  APP_KEY: {{ get $data "APP_KEY" | default (printf "base64:%s" (randAscii 32 | b64enc) | b64enc) }}
  {{- end }}
  {{- /* Only while set in values: dropping secret.previousAppKeys ends the rotation */}}
  {{- with $secretValues.previousAppKeys }}
  APP_PREVIOUS_KEYS: {{ . | b64enc }}
  {{- end }}
  REVERB_APP_SECRET: {{ get $data "REVERB_APP_SECRET" | default (randAlphaNum 32 | b64enc) }}
  {{- /* The database user's password: database.password; else the one kept from an earlier release
         (generated for the chart's PostgreSQL, or set before); else generated — unless the pods read
         it from database.existingSecret */}}
  {{- $db := .Values.database | default dict }}
  {{- if $db.password }}
  DB_PASSWORD: {{ $db.password | toString | b64enc }}
  {{- else if get $data "DB_PASSWORD" }}
  DB_PASSWORD: {{ get $data "DB_PASSWORD" }}
  {{- else if not $db.existingSecret }}
  DB_PASSWORD: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
  {{- /* SMTP and Redis passwords, while set */}}
  {{- with (.Values.mail | default dict).password }}
  MAIL_PASSWORD: {{ . | toString | b64enc }}
  {{- end }}
  {{- with (.Values.redis | default dict).password }}
  REDIS_PASSWORD: {{ . | toString | b64enc }}
  {{- end }}
  {{- if .Values.admin.password }}
  ADMIN_PASSWORD: {{ .Values.admin.password | b64enc }}
  {{- else }}
  ADMIN_PASSWORD: {{ get $data "ADMIN_PASSWORD" | default (randAlphaNum 16 | b64enc) }}
  {{- end }}
  {{- /* Billing events signing secret (docs/billing.md) + signup CAPTCHA (docs/white-label.md) — optional */}}
  {{- with (.Values.billing | default dict).webhookSecret }}
  BILLING_WEBHOOK_SECRET: {{ . | b64enc }}
  {{- end }}
  {{- with ((.Values.signup | default dict).captcha | default dict).secret }}
  SIGNUP_CAPTCHA_SECRET: {{ . | b64enc }}
  {{- end }}
{{- else if .Values.bootstrap.enabled }}
{{- /*
  secret.create=false: the first administrator's password is ADMIN_PASSWORD of your Secret. Without
  that key the bootstrap Job generates one and stores it here (key password) — never in a log.
  No data in the manifest: an upgrade leaves the stored password alone.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: runr-admin
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-bootstrap
    {{- include "runr.labels" . | nindent 4 }}
type: Opaque
{{- end }}
