{{/*
  In a marketplace install the chart generates the secret (secret.create: true).
  Values are generated randomly on the first install; on upgrade they are read from the existing secret (lookup),
  so APP_KEY / DB_PASSWORD do not change. If admin.password is given, it is used.
  Default secret.create: true. ci.sh deploy (deploy.sh) and the CI deploy create the secret themselves,
  so they pass secret.create=false.
*/}}
{{- if .Values.secret.create }}
{{- $ns := include "runr.namespace" . }}
{{- $existing := (lookup "v1" "Secret" $ns .Values.secretName) }}
{{- $data := dict }}
{{- if $existing }}{{- $data = $existing.data }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "runr.labels" . | nindent 4 }}
type: Opaque
data:
  {{- /* APP_KEY encrypts secrets at rest (docs/security.md). secret.appKey replaces it (key rotation:
         move the old key to secret.previousAppKeys, then run `php artisan secrets:encrypt --rotate`). */}}
  {{- $secretValues := .Values.secret | default dict }}
  {{- if $secretValues.appKey }}
  APP_KEY: {{ $secretValues.appKey | b64enc }}
  {{- else }}
  APP_KEY: {{ get $data "APP_KEY" | default (printf "base64:%s" (randAscii 32 | b64enc) | b64enc) }}
  {{- end }}
  {{- /* Only while set in values: dropping secret.previousAppKeys ends the rotation */}}
  {{- with $secretValues.previousAppKeys }}
  APP_PREVIOUS_KEYS: {{ . | b64enc }}
  {{- end }}
  REVERB_APP_SECRET: {{ get $data "REVERB_APP_SECRET" | default (randAlphaNum 32 | b64enc) }}
  DB_PASSWORD: {{ get $data "DB_PASSWORD" | default (randAlphaNum 24 | b64enc) }}
  {{- if .Values.admin.password }}
  ADMIN_PASSWORD: {{ .Values.admin.password | b64enc }}
  {{- else }}
  ADMIN_PASSWORD: {{ get $data "ADMIN_PASSWORD" | default (randAlphaNum 16 | b64enc) }}
  {{- end }}
  {{- /* Billing events signing secret (docs/billing.md) + signup CAPTCHA (docs/white-label.md) — optional */}}
  {{- with (.Values.billing | default dict).webhookSecret }}
  BILLING_WEBHOOK_SECRET: {{ . | b64enc }}
  {{- end }}
  {{- with ((.Values.signup | default dict).captcha | default dict).secret }}
  SIGNUP_CAPTCHA_SECRET: {{ . | b64enc }}
  {{- end }}
{{- end }}
