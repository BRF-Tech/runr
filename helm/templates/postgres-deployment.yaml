{{- if and (eq .Values.database.driver "pgsql") (not .Values.database.host) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runr-postgres
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-postgres
    {{- include "runr.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: runr-postgres
  template:
    metadata:
      labels:
        app: runr-postgres
    spec:
      automountServiceAccountToken: false
      {{- include "runr.imagePullSecrets" . | nindent 6 }}
      {{- include "runr.placement" (dict "root" . "colocate" false) | nindent 6 }}
      {{- include "runr.postgres-init" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ include "runr.image" (printf "%v:%v" .Values.database.postgres.image.repository .Values.database.postgres.image.tag) | quote }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            {{- /* Applied when PostgreSQL initialises an empty volume; later changes need ALTER USER (docs/install.md) */}}
            {{- $password := include "runr.passwordRef" (dict "root" . "values" .Values.database "key" "DB_PASSWORD" "required" true) | fromJson }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $password.name | quote }}
                  key: {{ $password.key | quote }}
            {{- if .Values.database.postgres.fixPgdata }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            {{- end }}
          resources:
            {{- toYaml .Values.database.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: runr-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: runr-postgres
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-postgres
    {{- include "runr.labels" . | nindent 4 }}
spec:
  selector:
    app: runr-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
{{- $class := (.Values.database.postgres | default dict).storageClassName }}
{{- include "runr.pvcGuard" (dict "root" . "name" "runr-postgres-data" "class" $class "field" "database.postgres") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runr-postgres-data
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-postgres
    {{- include "runr.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ include "runr.databaseStorageSize" . }}
  {{- with $class }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
