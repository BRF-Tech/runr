{{- if .Values.gateway.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runr-gateway
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-gateway
    {{- include "runr.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: runr-gateway
{{- end }}
---
{{- if .Values.api.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runr-api
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-api
    {{- include "runr.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: runr-api
{{- end }}
---
{{- if .Values.ui.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runr-ui
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-ui
    {{- include "runr.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: runr-ui
{{- end }}
---
{{- if and (eq .Values.database.driver "pgsql") (not .Values.database.host) .Values.database.postgres.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runr-postgres
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-postgres
    {{- include "runr.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: runr-postgres
{{- end }}
---
{{- if and (not .Values.redis.host) .Values.redis.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: runr-redis
  namespace: {{ include "runr.namespace" . }}
  labels:
    app: runr-redis
    {{- include "runr.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: runr-redis
{{- end }}
