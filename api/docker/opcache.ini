opcache.enable=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
opcache.revalidate_freq=0
opcache.validate_timestamps=1
; No JIT: under FrankenPHP's thread-safe PHP 8.3.36 the tracing JIT crashed workers (segfaults,
; "tried to allocate 4295229440 bytes" while loading a config file); a Laravel API gains little from it
opcache.jit=disable
opcache.jit_buffer_size=0
