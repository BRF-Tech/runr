upload_max_filesize = 64M
post_max_size       = 64M
memory_limit        = 256M
max_execution_time  = 300

; Native PHP sessions are not used (Laravel keeps its own), so their upload progress tracking stays
; off: it would run for every multipart request, whether or not the request starts a session
session.upload_progress.enabled = Off
; and a session id PHP did not create itself is never adopted
session.use_strict_mode = 1
expose_php = Off
