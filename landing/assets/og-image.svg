<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#E63946"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF8C42" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <filter id="rGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="180" r="280" fill="url(#glow)"/>
  <circle cx="180" cy="500" r="220" fill="url(#glow)" opacity="0.6"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>

  <!-- Logo hex -->
  <g transform="translate(180, 280)">
    <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36"
      fill="none" stroke="url(#r)" stroke-width="3.5" opacity="0.3"/>
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27"
      fill="#0f172a" stroke="url(#r)" stroke-width="4"/>
    <polygon points="-16,-22 20,0 -16,22" fill="url(#r)" filter="url(#rGlow)"/>
  </g>

  <!-- Title -->
  <text x="320" y="265" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="120" font-weight="900" fill="#e2e8f0">Run<tspan fill="url(#r)" filter="url(#rGlow)">R</tspan></text>

  <!-- Tagline -->
  <text x="320" y="320" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="28" font-weight="600" fill="#94a3b8">Open Source Serverless Architecture</text>
  <text x="320" y="358" font-family="'Segoe UI', system-ui, sans-serif"
        font-size="22" font-weight="400" fill="#64748b">Built on Kubernetes · Yours to Run</text>

  <!-- Feature chips -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600">
    <rect x="180" y="430" width="160" height="46" rx="23" fill="#111827" stroke="#f97316" stroke-width="1.5"/>
    <text x="260" y="460" text-anchor="middle" fill="#f97316">Scale-to-Zero</text>

    <rect x="356" y="430" width="160" height="46" rx="23" fill="#111827" stroke="#4ade80" stroke-width="1.5"/>
    <text x="436" y="460" text-anchor="middle" fill="#4ade80">100% Open Source</text>

    <rect x="532" y="430" width="180" height="46" rx="23" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="622" y="460" text-anchor="middle" fill="#38bdf8">Multi-Tenant</text>

    <rect x="728" y="430" width="180" height="46" rx="23" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="818" y="460" text-anchor="middle" fill="#a78bfa">Zero Lock-In</text>
  </g>

  <!-- Bottom domain -->
  <text x="600" y="585" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="22" font-weight="700" fill="#475569">runr.sh</text>
</svg>
