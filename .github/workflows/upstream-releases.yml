# Upstream releases RunR follows, every day and by hand: a released Knative minor for the
# KNATIVE_K8S_COMPAT table (ci/check-knative-releases.sh), versions of the Helm charts RunR
# installs into a region that are newer than the ones its code pins (ci/check-helm-releases.sh),
# and the newer versions of the packages RunR ships or builds with (ci/check-package-releases.sh:
# Composer, npm, Go modules, GitHub Actions pins, Dockerfile base images; one finding per group).
# Each finding is listed once, as a line of the week's digest issue "deps: week <ISO week>"
# (ci/deps-digest.sh; docs/development.md → Dependency test bot → The weekly digest): a finding a
# digest line or an issue already has, open or closed, is not listed again, and a quiet week opens
# no digest. An issue of its own only where a person acts: a finding with a security advisory
# (label "security", tested by the dependency test bot the same day: deps-test.yml with its issue
# number, not on Saturday), one issue per group for its releases outside the constraint (one a
# hold keeps with its reason is a digest line "held" instead), a Knative minor without its row.
name: Upstream releases

on:
  schedule:
    # every day 05:23 UTC
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-releases
  cancel-in-progress: false

jobs:
  check:
    name: Knative, Helm chart and package releases
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
      # deps-test.yml for a finding with a security advisory (a workflow_dispatch)
      actions: write
    env:
      # the helm of the API image (api/Dockerfile.prod)
      HELM_VERSION: v4.3.1
      HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm (pinned, checksum verified)
        run: |
          curl -fsSL -o /tmp/helm.tar.gz "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  /tmp/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf /tmp/helm.tar.gz -C "$RUNNER_TEMP/bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Knative releases
        env:
          RELEASES_REPORT_DIR: ${{ runner.temp }}/releases
        run: bash ci/check-knative-releases.sh
      - name: Helm chart releases
        if: ${{ !cancelled() }}
        env:
          RELEASES_REPORT_DIR: ${{ runner.temp }}/releases
        run: bash ci/check-helm-releases.sh
      # the tools of the package check, as ci.yml has them (composer outdated/audit, npm view/audit,
      # go list -u, govulncheck)
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        if: ${{ !cancelled() }}
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: 26
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: ${{ !cancelled() }}
        with:
          go-version: '1.27.4'
          cache-dependency-path: '**/go.sum'
      - name: Install govulncheck (pinned)
        if: ${{ !cancelled() }}
        env:
          GOVULNCHECK_VERSION: v1.1.4
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
      - name: Package releases
        if: ${{ !cancelled() }}
        env:
          RELEASES_REPORT_DIR: ${{ runner.temp }}/releases
          GOTOOLCHAIN: auto
          GOFLAGS: -mod=mod
        run: bash ci/check-package-releases.sh
      # the week's summary and the few issues where a person has to do something (ci/deps-digest.sh
      # file): a finding no row and no issue had yet becomes a row (a security one is tested today:
      # the bot's own run, one release at a time); a group's major versions are one issue; the
      # findings filed as issues of their own before the summary fold into it
      - name: The weekly summary and the issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_REPORT_DIR: ${{ runner.temp }}/releases
        run: |
          set -o pipefail
          gh label create deps --repo "$GITHUB_REPOSITORY" --color 0366d6 \
            --description "The dependency bots' weekly summary and the issues they open" 2>/dev/null || true
          gh label create security --repo "$GITHUB_REPOSITORY" --color b60205 \
            --description "A security advisory: the dependency test bot tests it the same day" 2>/dev/null || true
          gh label create "needs attention" --repo "$GITHUB_REPOSITORY" --color d93f0b \
            --description "The dependency test bot holds it: a person decides" 2>/dev/null || true
          mkdir -p "$RELEASES_REPORT_DIR"
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 \
            --json number,title,state,labels,body,createdAt > "$RUNNER_TEMP/issues.json"
          bash ci/deps-digest.sh file "$RELEASES_REPORT_DIR" "$RUNNER_TEMP/issues.json" "$(date -u +%F)" > "$RUNNER_TEMP/digest-ops.json"
          bash ci/deps-digest.sh apply "$RUNNER_TEMP/digest-ops.json" | sed 's/^/- /' | tee -a "$GITHUB_STEP_SUMMARY"
