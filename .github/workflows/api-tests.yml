# The API's checks: Pint, PHPUnit with the coverage floor, Larastan and the API reference with
# every module. Called by ci.yml (this checkout) and deps-test.yml (a dependency bump of next,
# from the bundle its bump job made); `result-name` uploads the outcome as an artifact of that
# name for the caller's report.
name: API tests

on:
  workflow_call:
    inputs:
      tree-artifact:
        description: 'An artifact with repo.bundle to test instead of this checkout (deps-test.yml)'
        type: string
        default: ''
      ref:
        description: 'The ref of the bundle to test'
        type: string
        default: ''
      result-name:
        description: 'Name of the result artifact (empty: none)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  api:
    name: API (Pint, PHPUnit, Larastan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api
    steps:
      - if: inputs.tree-artifact == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.tree-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.tree-artifact }}
          path: ${{ runner.temp }}/tree
      - name: The bundle's tree
        if: inputs.tree-artifact != ''
        working-directory: .
        env:
          REF: ${{ inputs.ref }}
        run: |
          git clone -q --no-checkout "$RUNNER_TEMP/tree/repo.bundle" .
          git checkout -q --detach "refs/remotes/origin/${REF}"
          git log -1 --format='%H %s'
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, pcntl
          coverage: pcov
          tools: composer:v2
      # PHP 8.2.35 or a later 8.2 release, the one that fixes CVE-2026-109618 and CVE-2026-109619 (the
      # API image has its own floor, PHP_MIN_VERSION of api/Dockerfile.prod)
      - name: PHP 8.2.35 or later
        run: |
          php -r 'exit((int) !(str_starts_with(PHP_VERSION, "8.2.") && version_compare(PHP_VERSION, "8.2.35", ">=")));' \
            || { echo "::error::PHP $(php -r 'echo PHP_VERSION;') is not 8.2.35 or a later 8.2 release"; exit 1; }
      - name: Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('api/composer.lock') }}
          restore-keys: composer-
      - id: composer
        run: composer install --no-interaction --prefer-dist --no-progress
      # Pint, PHPUnit and Larastan each report, whichever of them fails
      - name: Pint (code style; fix with vendor/bin/pint)
        if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
        run: vendor/bin/pint --test
      # Coverage floor: the line coverage of app/, the measured value rounded down to whole percent
      # (docs/development.md → Testing). The -d memory_limit is for the artisan process, which reads
      # the report PHPUnit wrote.
      - name: PHPUnit (coverage floor)
        if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
        run: |
          set -o pipefail
          cp .env.example .env && php artisan key:generate
          php -d memory_limit=2G artisan test --compact --coverage --min=76 2>&1 | tee "$RUNNER_TEMP/phpunit.log"
      # New findings fail; the known ones live in phpstan-baseline.neon
      - name: Larastan
        if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      # The API reference as the image builds it, every module enabled (api/docker/api-docs.sh, the
      # api-docs stage of api/Dockerfile.prod): every operation, the modules' too, has a one-line
      # summary, an operationId of its own and one group (ApiDocument::problems). Then ApiDocsTest
      # again with the modules on (the PHPUnit step runs it without them). The last step: it enables
      # the modules in this checkout
      - name: API reference (every module, as the image builds it)
        if: ${{ !cancelled() && steps.composer.outcome == 'success' }}
        run: |
          sh docker/api-docs.sh "$RUNNER_TEMP/openapi.json" --check
          TENANCY_ENABLED=true AUTH_PROVIDER_ENABLED=true TICKET_ENABLED=true BILLING_ENABLED=true \
            vendor/bin/phpunit --no-coverage tests/Feature/ApiDocsTest.php
      # the outcome for the caller: also when a step failed or the run was cancelled
      - name: Result
        if: always() && inputs.result-name != ''
        working-directory: .
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          echo "$JOB_STATUS" > "$RUNNER_TEMP/result/status"
          echo "PHPUnit, Pint, Larastan, API reference" > "$RUNNER_TEMP/result/command"
          # PHPUnit's failures and their count from its summary line ("Tests: 2 failed, 1230
          # passed"), and the end of its log; the summary line alone is no failure
          if [ -f "$RUNNER_TEMP/phpunit.log" ]; then
            grep -E '^\s*(FAILED|⨯|✗)|FAIL ' "$RUNNER_TEMP/phpunit.log" | head -n 40 > "$RUNNER_TEMP/result/failures.md" || true
            summary="$(grep -E 'Tests:' "$RUNNER_TEMP/phpunit.log" | tail -n 1 || true)"
            failed="$(sed -nE 's/.* ([0-9]+) (failed|errors?).*/\1/p' <<<"$summary" | head -n 1)"
            echo "${failed:-0}" > "$RUNNER_TEMP/result/failed"
            tail -n 40 "$RUNNER_TEMP/phpunit.log" > "$RUNNER_TEMP/result/tail.txt"
          else
            # no PHPUnit log: Composer or the checkout failed before it
            echo 1 > "$RUNNER_TEMP/result/failed"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.result-name != ''
        with:
          name: ${{ inputs.result-name }}
          path: ${{ runner.temp }}/result/
          retention-days: 7
