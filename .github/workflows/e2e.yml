# The long end-to-end suites, every week and by hand (Actions → E2E → Run workflow, or
# `gh workflow run e2e.yml -f suite=kind -f k8s=1.35.0`), on standard GitHub-hosted runners with
# their own Docker:
#   - kind: runtime/ci.sh test — a Kind cluster (1 control-plane + 2 workers), Knative and the API
#     stack of docker-compose.yml, every runtime deployed through the API. It needs neither
#     /dev/kvm nor a GPU: the sandbox cases run the gvisor RuntimeClass on the runc handler (the
#     Kind nodes have no gVisor). Kata (test-sandbox-api --sandbox-kata), the GPU case
#     (test-ai --ai-gpu) and the per-feature suites (test-runtimes, test-wasm, …) are not part of
#     it: they run on a host of their own (docs/development.md → CI jobs).
#   - ui-stack: Playwright against the dev stack (ui-stack-suite.yml: docker compose with postgres,
#     redis, api + migrator, horizon, reverb, mailpit, the vue dev server). Specs that need a
#     Kubernetes cluster skip themselves.
name: E2E

on:
  schedule:
    # Mondays 02:17 UTC
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suites to run'
        type: choice
        options: [all, kind, ui-stack]
        default: all
      k8s:
        description: 'kind: Kubernetes version of the cluster (a kindest-node tag of the reqs mirror)'
        default: '1.32.0'
      workers:
        description: 'kind: worker nodes (1: a runner short of disk; the control-plane then runs the platform pods too)'
        type: choice
        options: ['2', '1']
        default: '2'

permissions:
  contents: read

# a scheduled run and one started by hand on the same branch wait for each other
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # the steps: kind-suite.yml, which deps-test.yml runs too (a dependency bump of next)
  kind:
    name: Kind e2e (runtime/ci.sh test)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'kind'
    uses: ./.github/workflows/kind-suite.yml
    with:
      command: test
      k8s: ${{ inputs.k8s || '1.32.0' }}
      workers: ${{ inputs.workers || '2' }}

  # the steps: ui-stack-suite.yml, which deps-test.yml runs too (a dependency bump of the console)
  ui-stack:
    name: UI e2e (dev stack)
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'ui-stack'
    uses: ./.github/workflows/ui-stack-suite.yml
