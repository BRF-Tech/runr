# Q runtime for RunR: Q is a toy language made for this example. The interpreter
# (interpreter/, Go) is built into the runtime image by RunR in each region from the
# uploaded Dockerfile; it runs as a long-lived process that answers request envelopes
# line by line (persistent mode). Register it with POST /api/runtimes (see ../README.md).
apiVersion: runr.sh/v1
kind: Runtime
id: q
name: Q
description: Q, a tiny line-based language; one long-lived interpreter process answers every request.
icon: "data:image/svg+xml;base64,"
language: plaintext
extensions: [q]
category: general
versions:
  - version: "1.0"
    dockerfile: Dockerfile
    default: true
handler:
  file: main
template:
  files:
    "{file}": |
      # main.q: hello world in Q, for every trigger
      set name = query.name or "World"
      if trigger == "schedule" then return "tick from Q"
      if trigger == "queue" then return "processed {data.msg} (from Q)"
      print "Hello, {name}! (from Q)"
run:
  mode: persistent
  command: ["q", "/app/code/{file}"]
  workers: 1
triggers: [http, schedule, queue]
sandbox: [runc, gvisor, kata]
resources:
  cpu: "250m"
  memory_mb: 128
