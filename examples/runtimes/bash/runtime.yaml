# Bash runtime for RunR: the official bash image (bash:5.2, from the ghcr.io/brf-tech/runr/reqs mirror), the
# script runs once per invocation (exec mode, raw input). Register it with POST /api/runtimes (see ../README.md).
apiVersion: runr.sh/v1
kind: Runtime
id: bash
name: Bash
description: Bash scripts; RunR runs the script once per invocation with the request body on stdin.
language: shell
extensions: [sh, bash]
category: general
versions:
  - version: "5.2"
    image: ghcr.io/brf-tech/runr/reqs/bash:5.2
    default: true
handler:
  file: main
template:
  files:
    "{file}": |
      #!/usr/bin/env bash
      # RunR Bash example: exec mode, raw input. RunR runs this script once per invocation:
      # the request body arrives on stdin, metadata in RUNR_* variables, stdout is the response.
      set -euo pipefail

      urldecode() { local s="${1//+/ }"; printf '%b' "${s//%/\\x}"; }

      case "${RUNR_TRIGGER:-http}" in
        schedule)
          echo "schedule trigger fired" >&2
          echo "tick from bash"
          ;;
        queue)
          body="$(cat)"
          echo "queue message received" >&2
          printf 'processed %s (from bash)' "$body"
          ;;
        *)
          name=""
          IFS='&' read -ra pairs <<< "${RUNR_QUERY:-}"
          for pair in "${pairs[@]}"; do
            if [[ "$pair" == name=* ]]; then name="$(urldecode "${pair#name=}")"; fi
          done
          printf 'Hello, %s! (from bash)' "${name:-World}"
          ;;
      esac
run:
  mode: exec
  input: raw
  command: ["bash", "/app/code/{file}"]
triggers: [http, schedule, queue]
sandbox: [runc, gvisor, kata]
resources:
  cpu: "250m"
  memory_mb: 128
