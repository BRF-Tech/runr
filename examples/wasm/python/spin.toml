#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json
# Spin app of the Python example. In RunR the build uses the runtime's spin.toml, which also adds
# the packages of requirements.txt (installed into /tmp/runr-deps) to the component.
spin_manifest_version = 2

[application]
name = "runr-function"
version = "0.1.0"
description = "A RunR function (Python, componentize-py + Spin Python SDK)"

[[trigger.http]]
route = "/..."
component = "function"

[component.function]
source = "app.wasm"
allowed_outbound_hosts = ["https://*:*", "http://*:*"]

[component.function.build]
command = "componentize-py -w spin:up/http-trigger@4.1.0 componentize app -o app.wasm"
