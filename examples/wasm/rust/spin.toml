#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json
# Default Spin manifest of a wasm-rust function (build.files). One component serves every path;
# RunR's triggers (http, queue, schedule) all arrive as HTTP requests on it.
spin_manifest_version = 2

[application]
name = "runr-function"
version = "0.1.0"
description = "A RunR function (Rust, Spin SDK)"

[[trigger.http]]
route = "/..."
component = "function"

[component.function]
source = "target/wasm32-wasip1/release/runr_function.wasm"
# outbound HTTP(S) to any host; narrow it in a project's own spin.toml
allowed_outbound_hosts = ["https://*:*", "http://*:*"]

[component.function.build]
command = "cargo build --target wasm32-wasip1 --release"
